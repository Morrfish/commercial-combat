<svg xmlns="http://www.w3.org/2000/svg" width="620" height="210" viewBox="0 0 620 210"><rect width="620" height="210" rx="18" fill="#163c40"/><text x="108" y="78" font-family="Arial,sans-serif" font-size="21" fill="#edbb57" text-anchor="middle">ANNOUNCE</text><text x="108" y="117" font-family="Arial,sans-serif" font-size="16" fill="#f4e9cc" text-anchor="middle">Targets + costs</text><text x="208" y="100" font-family="Arial,sans-serif" font-size="25" fill="#edbb57" text-anchor="middle">&gt;</text><text x="311" y="78" font-family="Arial,sans-serif" font-size="21" fill="#edbb57" text-anchor="middle">RESPOND</text><text x="311" y="117" font-family="Arial,sans-serif" font-size="16" fill="#f4e9cc" text-anchor="middle">One defense choice</text><text x="411" y="100" font-family="Arial,sans-serif" font-size="25" fill="#edbb57" text-anchor="middle">&gt;</text><text x="514" y="78" font-family="Arial,sans-serif" font-size="21" fill="#edbb57" text-anchor="middle">RESOLVE</text><text x="514" y="117" font-family="Arial,sans-serif" font-size="16" fill="#f4e9cc" text-anchor="middle">Response, then effect</text><text x="310" y="177" font-family="Arial,sans-serif" font-size="18" fill="#f4e9cc" text-anchor="middle">No response to a response. No new window on redirect.</text></svg>