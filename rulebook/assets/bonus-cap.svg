<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240"><rect width="620" height="240" rx="18" fill="#163c40"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="18" fill="#edbb57" text-anchor="start">STRONGEST BONUS</text><text x="310" y="42" font-family="Arial,sans-serif" font-size="18" fill="#edbb57" text-anchor="start">STRONGEST PENALTY</text><text x="30" y="101" font-family="Arial,sans-serif" font-size="34" fill="#f4e9cc" text-anchor="start">+5, +10, +15</text><text x="310" y="101" font-family="Arial,sans-serif" font-size="34" fill="#f4e9cc" text-anchor="start">-5, -10</text><text x="310" y="161" font-family="Arial,sans-serif" font-size="26" fill="#f4e9cc" text-anchor="middle">Printed Attack 20 + 15 - 10 = 25</text><text x="310" y="205" font-family="Arial,sans-serif" font-size="17" fill="#f4e9cc" text-anchor="middle">Use one strongest source of each sign, capped at 15.</text></svg>